name: Feature Suggestion
description: |
  Make a feature suggestion. List mods that you think should be supported by the programm. 
  Before reporting, make sure an issue hasn't been reported already.
labels: ["feature suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this mod suggestion!
        If you would rather wish to fill out this issue in a full page and not this small window clich [here](https://github.com/MundM2007/Ultimate-Unification/issues/new?template=3-feature_suggestion.yaml)
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
      placeholder: "Example: I'm always frustrated when [...]."
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Feature Suggestion
      description: A clear and concise description of what you want to happen.
      placeholder: "Example: To solve this [...] should be added"
    validations:
      required: true