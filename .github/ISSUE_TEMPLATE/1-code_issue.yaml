name: Code Issue
description: |
  Report a code issue. A code issue accures when some error is shown in the console and the execution is halted before finishing. 
  Before reporting, make sure an issue hasn't been reported already.
labels: ["code issue"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this code issue report!
        If you would rather wish to fill out this issue in a full page and not this small window clich [here](https://github.com/MundM2007/Ultimate-Unification/issues/new?template=1-code_issue.yaml)
  - type: textarea
    id: describe-issue
    attributes:
      label: Describe the issue
      description: A clear and concise description of what the issue is. If applicable add screenshots to help explain the problem.
      placeholder: Whats happening?
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of Minecraft are you using?
      options:
        - 1.16.5
      default: 0
    validations:
      required: true
  - type: textarea
    id: related-files
    attributes:
      label: Related Files
      description: Please upload realted files, these include the 3 files listed in the config directory.
      placeholder: paste files or link to them here
    validations:
      required: true